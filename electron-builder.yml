appId: cc.4track.desktop
productName: 4Track Recorder
# No spaces in the download's file name.
artifactName: 4Track-Recorder-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.music
  # Icon Composer file; electron-builder compiles it with actool (needs Xcode 26+).
  icon: assets/4TrackRecorder.icon
  # Apple Silicon only: skips the Intel build and the universal merge step.
  target:
    - target: dmg
      arch: arm64
  hardenedRuntime: true
  # Notarization runs in build/notarize.cjs instead (the built-in step fails
  # for app names starting with a digit).
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: 4Track Recorder needs the microphone to record onto your cassette.
afterSign: build/notarize.cjs
# `npm run release -- --publish always` uploads to a draft GitHub release
# (needs GH_TOKEN in the environment).
publish:
  provider: github
  owner: andreboekhorst
  repo: 4track-electron
  releaseType: draft
fileAssociations:
  - ext: 4trk
    name: 4Track Cassette
    description: 4Track Cassette
    role: Editor
